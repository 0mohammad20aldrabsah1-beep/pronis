<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <title>يمن والت — جوائز مالية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0a1628;
      --gold: #ffc20e;
      --gold-light: #ffe566;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Tajawal", sans-serif;
      min-height: 100dvh;
      color: #fff;
      background: var(--navy);
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(45, 100, 180, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse 90% 50% at 50% 100%, rgba(245, 166, 35, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, #0f2848 0%, var(--navy) 35%, #050d18 100%);
      pointer-events: none;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(255, 197, 14, 0.7) 50%, transparent 50%),
        radial-gradient(1px 1px at 85% 15%, rgba(255, 255, 255, 0.5) 50%, transparent 50%),
        radial-gradient(1.5px 1.5px at 70% 80%, rgba(255, 197, 14, 0.5) 50%, transparent 50%),
        radial-gradient(1px 1px at 25% 65%, rgba(255, 255, 255, 0.35) 50%, transparent 50%),
        radial-gradient(1px 1px at 50% 40%, rgba(255, 197, 14, 0.4) 50%, transparent 50%);
      opacity: 0.85;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      to {
        opacity: 0.45;
      }
    }

    .home {
      position: relative;
      z-index: 1;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(1rem, env(safe-area-inset-top)) 1rem calc(7.5rem + env(safe-area-inset-bottom));
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.35rem 0 1rem;
    }

    .top-bar img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .top-bar span {
      font-size: 1rem;
      font-weight: 800;
      color: #7dc144;
      letter-spacing: 0.02em;
    }

    .hero-frame {
      position: relative;
      border-radius: 20px;
      padding: 3px;
      background: linear-gradient(
        145deg,
        rgba(255, 197, 14, 0.85) 0%,
        rgba(255, 255, 255, 0.15) 40%,
        rgba(45, 120, 200, 0.4) 100%
      );
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 60px rgba(255, 197, 14, 0.08);
    }

    .hero-frame::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 21px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, transparent 40%);
      pointer-events: none;
      z-index: 2;
    }

    .hero-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 17px;
      vertical-align: middle;
    }

    .prizes-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    .chip {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 197, 14, 0.25);
      color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
    }

    .divider-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1.35rem;
      padding: 0 0.5rem;
    }

    .divider-line::before,
    .divider-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 197, 14, 0.45), transparent);
    }

    .divider-line p {
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
      white-space: nowrap;
    }

    .cta-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      padding: 1rem 1rem max(1rem, env(safe-area-inset-bottom));
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(5, 13, 24, 0.75) 25%,
        rgba(5, 13, 24, 0.97) 100%
      );
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .cta-inner {
      max-width: 440px;
      margin: 0 auto;
    }

    .btn-win {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 1.05rem 1.25rem;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      color: #1a1200;
      text-decoration: none;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold-light) 0%, #f5a623 48%, #e8940f 100%);
      box-shadow:
        0 4px 0 #c47a0a,
        0 8px 28px rgba(245, 166, 35, 0.45);
      transition: transform 0.12s, box-shadow 0.12s;
      animation: pulse-glow 2.5s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%,
      100% {
        box-shadow:
          0 4px 0 #c47a0a,
          0 8px 28px rgba(245, 166, 35, 0.45);
      }
      50% {
        box-shadow:
          0 4px 0 #c47a0a,
          0 8px 36px rgba(255, 197, 14, 0.55);
      }
    }

    .btn-win:hover {
      filter: brightness(1.05);
    }

    .btn-win:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #c47a0a,
        0 4px 16px rgba(245, 166, 35, 0.4);
      animation: none;
    }

    .btn-win svg {
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
    }

    .cta-note {
      text-align: center;
      margin-top: 0.65rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="home">
    <header class="top-bar">
      <img src="yemen-wallet-logo2.svg" alt="" width="36" height="36" />
      <span>يمن والت</span>
    </header>

    <div class="hero-frame">
      <img
        class="hero-img"
        src="e9746b4e-3951-4dfa-ae9d-22ac5a2e130b.png"
        alt="جوائز مالية و ايفونات — مع محفظتك فرصتك أكبر"
        width="440"
        height="440"
        fetchpriority="high"
      />
    </div>

    <div class="prizes-row" aria-hidden="true">
      <span class="chip">آيفونات</span>
      <span class="chip">جوائز نقدية</span>
      <span class="chip">بطاقات هدايا</span>
    </div>

    <div class="divider-line">
      <p>مع محفظتك.. فرصتك أكبر</p>
    </div>
  </main>

  <div class="cta-dock">
    <div class="cta-inner">
      <a class="btn-win" href="dakhul-hisab.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6L12 2z" stroke-linejoin="round" />
        </svg>
        اربح الآن
      </a>
      <p class="cta-note">سجّل دخولك للمشاركة في السحب — مجاناً</p>
    </div>
  </div>
</body>
</html>
